name: Daily site check

on:
  schedule:
    # Three chances a day: the probe records the date, so extra runs on the same
    # day are no-ops and only the first one commits.
    - cron: '23 1 * * *'
    - cron: '23 9 * * *'
    - cron: '23 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Probe public links
        run: node scripts/site-check.mjs

      - name: Commit and push
        run: |
          git config user.name "FeizenF"
          git config user.email "FeizenF@users.noreply.github.com"
          git add src/data/siteStatus.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore(site-check): $(date -u +'%Y-%m-%d')"
          git push
